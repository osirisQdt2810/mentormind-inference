[project]
name = "mentormind-inference"
version = "0.1.0"
description = "MentorMind inference server: Qwen3-VL-8B-Instruct on one GPU (vLLM, or Ollama) plus a CPU gateway (faster-whisper ASR, bge-m3 embeddings, Docling) that proxies the VLM, so one URL serves everything."
requires-python = ">=3.11,<3.13"
# Driver on the dev box is CUDA 12.6 (no root to upgrade it). vLLM 0.16.0 is the newest release
# whose torch (2.9.1) still ships a cu126 build; 0.17+ moves to torch 2.10+ / cu128+ only.
# torch/torchvision/torchaudio are pinned to the cu126 index below, otherwise the resolver picks
# the default CUDA 12.8/13 wheels and the engine dies on init_device.
dependencies = [
    "vllm==0.16.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10",
]

[dependency-groups]
# Everything the tests import, nothing heavy (the gateway's engines are faked):
#   uv run --only-group dev python -m pytest
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
